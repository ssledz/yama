name: release

# Publishes the executable fat jar (`yama`) as a GitHub release. Runs only by hand
# (Actions -> release -> Run workflow, pick the branch); merging into main publishes nothing.
#
#   main    -> release X.Y.Z from version.sbt with -SNAPSHOT stripped (0.1.0-SNAPSHOT -> 0.1.0): build the jar with
#              that version, tag the main commit vX.Y.Z, publish the release, then bump develop to the next minor
#              snapshot (0.2.0-SNAPSHOT) if it still holds X.Y.Z-SNAPSHOT. Refused if vX.Y.Z is already tagged.
#   develop -> a pre-release of the snapshot, e.g. v0.2.0-SNAPSHOT at the current develop commit. Running it again
#              replaces it, so there is one pre-release per snapshot version, always the latest build.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, develop

      - name: What to release?
        id: plan
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          snapshot=$(sed -nE 's/.*version := "([^"]+)".*/\1/p' version.sbt)
          fail() { echo "::error::$1"; exit 1; }
          echo "branch: $BRANCH, version.sbt: $snapshot"
          if [[ "$BRANCH" == main ]]; then
            version=${snapshot%-SNAPSHOT}
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "main holds $snapshot: expected X.Y.Z[-SNAPSHOT]"
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
              && fail "v$version is already released: bump the version in version.sbt on develop and merge it"
            mode=release
          elif [[ "$BRANCH" == develop ]]; then
            [[ "$snapshot" == *-SNAPSHOT ]] || fail "develop holds $snapshot: expected a -SNAPSHOT version"
            version=$snapshot
            mode=prerelease
          else
            fail "release from main or develop, not $BRANCH"
          fi
          echo "releasing $version ($mode)"
          { echo "mode=$mode"; echo "version=$version"; echo "tag=v$version"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Build the fat jar
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sbt "set ThisBuild / version := \"$VERSION\"" yama-cli/assembly   # main: the version without -SNAPSHOT
          cp projects/yama-cli/target/scala-3.*/yama.jar yama
          chmod +x yama
          ./yama --version | tee /dev/stderr | grep -qx "$VERSION"   # the launcher works and the version is baked in

      - name: Publish ${{ steps.plan.outputs.tag }}
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" yama --target "$SHA" --title "yama ${TAG#v}" --generate-notes

      - name: Publish pre-release ${{ steps.plan.outputs.tag }}
        if: steps.plan.outputs.mode == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # one pre-release per snapshot version: replace the previous build (and move its tag)
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" yama --target "$SHA" --prerelease --latest=false \
            --title "yama ${TAG#v} (${SHA::7})" \
            --notes "Development build of develop at $SHA. Replaced by every manual release run on develop."

      - name: Bump develop to the next snapshot
        if: steps.plan.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          IFS=. read -r major minor _ <<< "$VERSION"
          next="$major.$((minor + 1)).0-SNAPSHOT"
          git checkout -B develop origin/develop
          dev=$(sed -nE 's/.*version := "([^"]+)".*/\1/p' version.sbt)
          if [[ "$dev" != "$VERSION-SNAPSHOT" ]]; then
            echo "develop holds $dev, not $VERSION-SNAPSHOT: leaving it as is"
            exit 0
          fi
          sed -i -E "s/(version := \")[^\"]+(\")/\1$next\2/" version.sbt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set version to $next"
          git push origin develop
          echo "develop bumped to $next"
